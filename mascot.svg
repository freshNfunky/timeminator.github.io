<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" role="img" aria-label="Timeminator mascot: a clock faced cyborg holding a chrono blaster">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".45" stop-color="#cbd5e1"/>
      <stop offset=".55" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="chromeSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#475569"/>
      <stop offset=".5" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="redEye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".18" stop-color="#fecaca"/>
      <stop offset=".45" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="redMuzzle" cx=".3" cy=".5" r=".7">
      <stop offset="0" stop-color="#fff5f5"/>
      <stop offset=".25" stop-color="#fca5a5"/>
      <stop offset=".6" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="tick" overflow="visible">
      <rect x="-1.4" y="-100" width="2.8" height="10" fill="#0f172a"/>
    </symbol>
    <symbol id="tickBig" overflow="visible">
      <rect x="-3" y="-100" width="6" height="16" fill="#0f172a"/>
    </symbol>
  </defs>

  <g id="body" transform="translate(0,0)">
    <path d="M60 640 L100 380 Q140 350 175 342 L200 360 L240 342 Q305 335 345 360 L370 342 Q405 355 425 385 L470 640 Z"
          fill="url(#leather)"/>
    <path d="M105 385 Q125 372 155 368 L175 342 L200 360 L240 342 L260 368 Q295 372 320 388 L305 420 Q245 402 200 402 Q160 402 135 418 Z"
          fill="#1f2937"/>
    <path d="M175 342 L200 360 L240 342 L235 460 L200 540 L180 460 Z" fill="#0b1220"/>
    <path d="M198 360 L200 540" stroke="#334155" stroke-width="1.5" opacity=".7"/>

    <g id="rightArm" transform="translate(0,0)">
      <path d="M345 360 Q390 380 405 430 L385 500 Q365 470 345 445 Z" fill="url(#leather)"/>
    </g>

    <g id="leftArm">
      <ellipse cx="112" cy="405" rx="26" ry="34" fill="url(#chromeSide)"/>
      <rect x="90" y="425" width="44" height="22" rx="4" fill="#0f172a"/>
      <rect x="95" y="447" width="36" height="18" rx="3" fill="url(#chromeSide)"/>
      <rect x="98" y="465" width="32" height="18" rx="3" fill="#0f172a"/>
      <rect x="100" y="483" width="28" height="18" rx="3" fill="url(#chromeSide)"/>
      <rect x="102" y="501" width="26" height="18" rx="3" fill="#0f172a"/>
      <ellipse cx="115" cy="525" rx="22" ry="12" fill="url(#chromeSide)"/>
      <g transform="translate(115,528)">
        <rect x="-8" y="-4" width="8" height="30" rx="2" fill="url(#chromeSide)"/>
        <rect x="2" y="-4" width="8" height="30" rx="2" fill="url(#chromeSide)"/>
        <rect x="12" y="-4" width="8" height="26" rx="2" fill="url(#chromeSide)"/>
      </g>
    </g>

    <g id="chronoGun" transform="translate(200,470) rotate(-14)">
      <rect x="-10" y="-14" width="230" height="28" rx="6" fill="#111827"/>
      <rect x="-10" y="-14" width="230" height="28" rx="6" fill="url(#chromeSide)" opacity=".35"/>
      <rect x="-16" y="-18" width="30" height="36" rx="4" fill="#0f172a"/>
      <rect x="-16" y="-18" width="30" height="36" rx="4" fill="url(#chromeSide)" opacity=".35"/>
      <rect x="12" y="14" width="18" height="26" rx="3" fill="#0f172a"/>
      <rect x="35" y="14" width="60" height="20" rx="3" fill="#111827"/>
      <rect x="220" y="-10" width="30" height="20" rx="3" fill="url(#chromeSide)"/>
      <g transform="translate(60,-4)">
        <circle r="14" fill="#0b1220" stroke="url(#chromeSide)" stroke-width="2"/>
        <line x1="0" y1="0" x2="0" y2="-9" stroke="#f8fafc" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="6" y2="3" stroke="#f8fafc" stroke-width="1.5"/>
        <circle r="1.6" fill="#ef4444"/>
      </g>
      <g transform="translate(140,-4)">
        <circle r="10" fill="#0b1220" stroke="url(#chromeSide)" stroke-width="2"/>
        <line x1="0" y1="0" x2="0" y2="-6" stroke="#f8fafc" stroke-width="1.2"/>
        <line x1="0" y1="0" x2="4" y2="2" stroke="#f8fafc" stroke-width="1.2"/>
      </g>
      <circle cx="260" cy="0" r="14" fill="url(#redMuzzle)" filter="url(#redGlow)"/>
      <text x="292" y="-14" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700" fill="#ef4444" filter="url(#redGlow)">08:15</text>
      <text x="318" y="8" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="700" fill="#fca5a5" opacity=".85">03:42</text>
      <text x="304" y="26" font-family="ui-monospace,Menlo,monospace" font-size="9" font-weight="700" fill="#fee2e2" opacity=".7">00:59</text>
    </g>

    <g id="rightHand" transform="translate(340,455)">
      <ellipse rx="20" ry="14" fill="url(#chromeSide)"/>
      <rect x="-16" y="-10" width="8" height="22" rx="2" fill="url(#chromeSide)"/>
      <rect x="-6" y="-12" width="8" height="24" rx="2" fill="url(#chromeSide)"/>
    </g>
  </g>

  <g id="head" transform="translate(240,180)">
    <ellipse cx="0" cy="128" rx="60" ry="18" fill="#0b1220" opacity=".55"/>
    <rect x="-32" y="118" width="64" height="20" rx="4" fill="url(#chromeSide)"/>
    <rect x="-28" y="122" width="56" height="4" fill="#0f172a" opacity=".5"/>
    <rect x="-28" y="130" width="56" height="4" fill="#0f172a" opacity=".5"/>

    <circle r="128" fill="url(#chrome)"/>
    <circle r="120" fill="#0f172a"/>
    <circle r="118" fill="url(#dial)"/>

    <g id="ticks">
      <use href="#tickBig" transform="rotate(0)"/>
      <use href="#tickBig" transform="rotate(30)"/>
      <use href="#tickBig" transform="rotate(60)"/>
      <use href="#tickBig" transform="rotate(90)"/>
      <use href="#tickBig" transform="rotate(120)"/>
      <use href="#tickBig" transform="rotate(150)"/>
      <use href="#tickBig" transform="rotate(180)"/>
      <use href="#tickBig" transform="rotate(210)"/>
      <use href="#tickBig" transform="rotate(240)"/>
      <use href="#tickBig" transform="rotate(270)"/>
      <use href="#tickBig" transform="rotate(300)"/>
      <use href="#tickBig" transform="rotate(330)"/>
    </g>

    <g font-family="'Inter',system-ui,sans-serif" font-weight="900" font-size="22" fill="#0f172a" text-anchor="middle">
      <text x="0" y="-72">12</text>
      <text x="82" y="8">3</text>
      <text x="0" y="88">6</text>
      <text x="-82" y="8">9</text>
    </g>

    <g id="brand" transform="translate(0,45)" font-family="'Inter',system-ui,sans-serif" text-anchor="middle">
      <text y="0" font-size="9" font-weight="800" fill="#1d4ed8" letter-spacing="4">TIMEMINATOR</text>
      <text y="12" font-size="6" font-weight="600" fill="#64748b" letter-spacing="3">CHRONO 800</text>
    </g>

    <g id="hands" transform="rotate(0)">
      <g transform="rotate(-60)">
        <rect x="-4" y="-70" width="8" height="80" rx="2" fill="#0f172a"/>
        <polygon points="0,-78 -5,-66 5,-66" fill="#0f172a"/>
      </g>
      <g transform="rotate(60)">
        <rect x="-3" y="-95" width="6" height="105" rx="2" fill="#0f172a"/>
        <polygon points="0,-102 -4,-92 4,-92" fill="#0f172a"/>
      </g>
      <g transform="rotate(120)">
        <rect x="-1.2" y="-100" width="2.4" height="115" fill="#dc2626"/>
        <circle cy="-100" r="4" fill="#dc2626"/>
      </g>
      <circle r="6" fill="#0f172a"/>
      <circle r="2.5" fill="#dc2626"/>
    </g>

    <g id="shades">
      <path d="M-108 -10 Q-104 -34 -60 -34 L-14 -34 Q0 -32 0 -22 Q0 -32 14 -34 L60 -34 Q104 -34 108 -10 L104 6 Q98 30 60 32 L14 32 Q0 28 0 18 Q0 28 -14 32 L-60 32 Q-98 30 -104 6 Z"
            fill="#050505" stroke="#0b1220" stroke-width="2"/>
      <g filter="url(#redGlow)">
        <ellipse cx="-58" cy="-2" rx="38" ry="24" fill="url(#redEye)"/>
        <ellipse cx="58" cy="-2" rx="38" ry="24" fill="url(#redEye)"/>
      </g>
      <path d="M-108 -10 Q-104 -34 -60 -34 L-14 -34 Q0 -32 0 -22 Q0 -32 14 -34 L60 -34 Q104 -34 108 -10 L104 6 Q98 30 60 32 L14 32 Q0 28 0 18 Q0 28 -14 32 L-60 32 Q-98 30 -104 6 Z"
            fill="none" stroke="#000" stroke-width="3"/>
      <path d="M-96 -14 Q-70 -30 -20 -28 M20 -28 Q70 -30 96 -14"
            fill="none" stroke="#334155" stroke-width="1.5" opacity=".6"/>
      <ellipse cx="-78" cy="-16" rx="12" ry="4" fill="#fecaca" opacity=".55"/>
      <ellipse cx="42" cy="-16" rx="10" ry="3" fill="#fecaca" opacity=".55"/>
    </g>

    <g id="damage" opacity=".9">
      <path d="M64 -70 L82 -50 L72 -38 L88 -22 L70 -14"
            fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M78 -46 Q90 -40 96 -28" fill="none" stroke="url(#chromeSide)" stroke-width="4"/>
      <circle cx="86" cy="-32" r="3" fill="#0f172a"/>
    </g>
  </g>

  <g id="chip" transform="translate(410,540)" font-family="'Inter',system-ui,sans-serif" opacity=".85">
    <rect x="-70" y="-16" width="70" height="26" rx="4" fill="#0f172a"/>
    <text x="-35" y="2" font-size="9" font-weight="800" fill="#3b82f6" text-anchor="middle" letter-spacing="1.5">T 800 CHRONO</text>
    <text x="-35" y="12" font-size="6" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">v1.0</text>
  </g>
</svg>
